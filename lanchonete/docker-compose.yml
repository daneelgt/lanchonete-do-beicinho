services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev

  # Serviço de produção
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    profiles:
      - prod